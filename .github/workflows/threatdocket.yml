name: ThreatDocket CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --disable-pip-version-check .
      - name: Run tests
        env:
          PYTHONPATH: tests
        run: python -m unittest discover -s tests -v

  scan:
    name: ThreatDocket scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Scan this repository with ThreatDocket
        uses: ./
        with:
          path: .
          # The demo project and tests contain deliberate findings and fake keys.
          exclude: |
            examples/**
            tests/**

  demo:
    name: ThreatDocket demo scan (report-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Scan the intentionally risky demo project
        uses: ./
        with:
          path: examples/demo
          category: threatdocket-demo
          # Showcase only: these findings are deliberate and never fail CI.
          fail-on-findings: "false"
          annotations: "false"
          # AI advisory: enabled once the THREATDOCKET_LLM_PROVIDER repository variable is set.
          # Configure under Settings -> Secrets and variables -> Actions (see README).
          # Only aggregate rule counts are sent to the model, never source code.
          advise: ${{ vars.THREATDOCKET_LLM_PROVIDER != '' && 'true' || 'false' }}
          llm-provider: ${{ vars.THREATDOCKET_LLM_PROVIDER }}
          llm-model: ${{ vars.THREATDOCKET_LLM_MODEL }}
          llm-base-url: ${{ vars.THREATDOCKET_LLM_BASE_URL }}
          llm-api-key: ${{ secrets.THREATDOCKET_LLM_API_KEY }}
