name: ThreatDocket CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --disable-pip-version-check .
      - name: Run tests
        env:
          PYTHONPATH: tests
        run: python -m unittest discover -s tests -v

  scan:
    name: ThreatDocket scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Scan this repository with ThreatDocket
        uses: ./
        with:
          path: .
          # The demo project and tests contain deliberate findings and fake keys.
          exclude: |
            examples/**
            tests/**
