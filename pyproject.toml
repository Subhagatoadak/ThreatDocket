[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatdocket"
version = "1.0.2"
description = "Local AI threat analysis and defensive control review with MITRE ATLAS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8,<9", "PyYAML>=6,<7"]

[project.scripts]
threatdocket = "threatdocket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threatdocket = ["data/*.json", "data/*.txt"]
